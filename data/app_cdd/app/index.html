<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | Caldo de Dragón</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #070d0e;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        user-select: none;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070d0e;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        position: absolute;
        inset: 0;
        background: #070d0e;
        outline: none;
      }
      #unity-loading-bar {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070d0e;
        z-index: 50;
        padding: 20px;
        transition: opacity 0.4s ease-out;
      }
      .cdd-card {
        background: rgba(13, 23, 24, 0.95);
        border: 1px solid rgba(56, 189, 180, 0.35);
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(45, 212, 191, 0.18);
        border-radius: 16px;
        padding: 32px 36px;
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .cdd-logo-wrapper {
        position: relative;
        width: 68px;
        height: 68px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cdd-spinner {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(45, 212, 191, 0.15);
        border-top-color: #2dd4bf;
        border-right-color: #14b8a6;
        animation: cddSpin 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes cddSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .cdd-logo-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, #0d9488, #2dd4bf);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(45, 212, 191, 0.4);
      }
      .cdd-logo-icon svg {
        width: 26px;
        height: 26px;
        fill: #042f2e;
      }
      .cdd-title {
        font-size: 20px;
        font-weight: 700;
        color: #f8fafc;
        margin: 0 0 6px 0;
        letter-spacing: -0.01em;
      }
      .cdd-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin: 0 0 22px 0;
        line-height: 1.4;
      }
      .cdd-track {
        width: 100%;
        height: 8px;
        background: rgba(30, 41, 59, 0.8);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cdd-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0d9488, #2dd4bf, #5eead4);
        border-radius: 9999px;
        transition: width 0.15s ease-out;
        box-shadow: 0 0 12px rgba(45, 212, 191, 0.6);
      }
      .cdd-info-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 12px;
      }
      .cdd-status {
        color: #2dd4bf;
        font-weight: 500;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 290px;
      }
      .cdd-pct {
        color: #f1f5f9;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #unity-warning {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        display: none;
        z-index: 100;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        max-width: 90%;
        text-align: center;
      }
      #unity-footer {
        display: none !important;
      }
    </style>

  .cdd-sub {

  .cdd-bar-track {

    background: rgba(30, 41, 59, 0.8);

  }
  .cdd-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0d9488, #2dd4bf, #5eead4);

    box-shadow: 0 0 12px rgba(45, 212, 191, 0.6);
  }
  .cdd-meta-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;

    color: #64748b;
  }
  .cdd-status-txt {
    color: #2dd4bf;
    font-weight: 500;
  }

</style>

</head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      
      <div id="unity-loading-bar">
        <div class="cdd-card">
          <div class="cdd-logo-wrapper">
            <div class="cdd-spinner"></div>
            <div class="cdd-logo-icon">
              <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
              </svg>
            </div>
          </div>
          <h1 class="cdd-title">Caldo de Dragón</h1>
          <p class="cdd-subtitle">Cargando motor gráfico Unity WebGL...</p>
          
          <div class="cdd-track">
            <div id="cdd-bar-fill" class="cdd-fill"></div>
          </div>
          
          <div class="cdd-info-row">
            <span id="cdd-status-text" class="cdd-status">Descargando datos del juego...</span>
            <span id="cdd-pct-text" class="cdd-pct">0%</span>
          </div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>

    <script>
      (function() {
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var barFill = document.querySelector("#cdd-bar-fill");
        var statusText = document.querySelector("#cdd-status-text");
        var pctText = document.querySelector("#cdd-pct-text");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
          if (!warningBanner) return;
          warningBanner.innerHTML = msg;
          warningBanner.style.display = "block";
          if (type === "warning") {
            warningBanner.style.background = "#eab308";
            setTimeout(function() {
              warningBanner.style.display = "none";
            }, 6000);
          } else {
            warningBanner.style.background = "#ef4444";
          }
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Nueva carpeta (22).loader.js";
        var config = {
          dataUrl: buildUrl + "/Nueva carpeta (22).data",
          frameworkUrl: buildUrl + "/Nueva carpeta (22).framework.js",
          codeUrl: buildUrl + "/Nueva carpeta (22).wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "SombriorStudios",
          productName: "Caldo de Dragon",
          productVersion: "5.0.0",
          showBanner: unityShowBanner,
        };

        var lastPct = 0;
        function updateProgress(progress) {
          var val = typeof progress === "number" && !isNaN(progress) ? progress : 0;
          var pct = Math.max(0, Math.min(100, Math.round(val * 100)));
          if (pct >= lastPct) lastPct = pct;

          if (barFill) barFill.style.width = lastPct + "%";
          if (pctText) pctText.textContent = lastPct + "%";

          if (statusText) {
            if (lastPct < 35) {
              statusText.textContent = "Descargando texturas y modelos (" + lastPct + "%)...";
            } else if (lastPct < 75) {
              statusText.textContent = "Descargando código WebAssembly (" + lastPct + "%)...";
            } else if (lastPct < 95) {
              statusText.textContent = "Compilando shaders y escena (" + lastPct + "%)...";
            } else {
              statusText.textContent = "¡Iniciando Caldo de Dragón!";
            }
          }
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          if (typeof createUnityInstance !== "function") {
            unityShowBanner("Error: No se pudo inicializar createUnityInstance", "error");
            return;
          }

          createUnityInstance(canvas, config, function(progress) {
            updateProgress(progress);
          }).then(function(unityInstance) {
            if (barFill) barFill.style.width = "100%";
            if (pctText) pctText.textContent = "100%";
            if (statusText) statusText.textContent = "¡Listo!";
            
            setTimeout(function() {
              if (loadingBar) {
                loadingBar.style.opacity = "0";
                setTimeout(function() {
                  loadingBar.style.display = "none";
                }, 400);
              }
              if (canvas) canvas.focus();
            }, 300);
          }).catch(function(err) {
            console.error("[Unity WebGL Error]", err);
            unityShowBanner("Error al ejecutar Unity WebGL: " + (err.message || err), "error");
          });
        };

        script.onerror = function() {
          unityShowBanner("No se pudo cargar el loader de Unity (" + loaderUrl + "). Revisa la conexión.", "error");
        };

        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
